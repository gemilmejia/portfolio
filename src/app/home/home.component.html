<!-- NAVBAR -->
<nav class="navbar custom-navbar">
  <div class="container navbar-container">
    <!-- BRAND -->
    <a class="navbar-brand" href="#">
      Gemil Mejia <br />
      <small>Software Developer</small>
    </a>

    <!-- HAMBURGER -->
    <!-- <button class="hamburger" (click)="toggleMenu()">
      <i class="fas fa-bars"></i>
    </button> -->
    <button
      #hamburgerButton
      type="button"
      class="hamburger"
      aria-label="Navigation menu"
      [attr.aria-expanded]="menuOpen"
      aria-controls="mobile-navigation"
      (click)="toggleMenu()"
    >
      <span aria-hidden="true">☰</span>
    </button>

    <!-- DESKTOP LINKS -->
    <div class="navbar-links">
      <a
        href="#hero"
        (click)="scrollToSection('hero'); $event.preventDefault()"
      >
        HOME
      </a>
      <a
        href="#about"
        (click)="scrollToSection('about'); $event.preventDefault()"
      >
        ABOUT
      </a>
      <a
        href="#projects"
        (click)="scrollToSection('projects'); $event.preventDefault()"
      >
        PROJECTS
      </a>
      <a
        href="#design"
        (click)="scrollToSection('design'); $event.preventDefault()"
      >
        DESIGN
      </a>
      <a
        href="#contact"
        (click)="scrollToSection('contact'); $event.preventDefault()"
      >
        CONTACT
      </a>
    </div>

    <!-- RIGHT ICONS -->
    <div class="navbar-right">
      <a
        href="https://www.instagram.com/mejiagemil_/"
        target="_blank"
        rel="noopener noreferrer"
        class="social-icon"
        aria-label="Instagram"
      >
        <i class="fab fa-instagram" aria-hidden="true"></i>
      </a>

      <a
        href="https://www.linkedin.com/in/gemil-m-365346217/"
        target="_blank"
        rel="noopener noreferrer"
        class="social-icon"
        aria-label="LinkedIn"
      >
        <i class="fab fa-linkedin" aria-hidden="true"></i>
      </a>

      <button
        type="button"
        class="dark-mode-toggle"
        (click)="toggleDarkMode()"
        [attr.aria-label]="
          isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'
        "
        [attr.title]="isDarkMode ? 'Light Mode' : 'Dark Mode'"
      >
        <i
          class="fas"
          [class.fa-sun]="isDarkMode"
          [class.fa-moon]="!isDarkMode"
          aria-hidden="true"
        ></i>
      </button>
    </div>
  </div>
</nav>
<!-- NAVBAR END -->

<!-- Overlay -->
<div
  class="drawer-overlay"
  [class.active]="menuOpen"
  (click)="closeMenu()"
></div>

<!-- Drawer -->
<div
  id="mobile-navigation"
  class="drawer"
  [class.open]="menuOpen"
  [inert]="!menuOpen"
>
  <button
    type="button"
    class="drawer-close"
    aria-label="Close navigation menu"
    (click)="closeMenu()"
  >
    <span aria-hidden="true">✕</span>
  </button>

  <a href="#hero" (click)="scrollToSection('hero'); $event.preventDefault()">
    HOME
  </a>
  <a href="#about" (click)="scrollToSection('about'); $event.preventDefault()">
    ABOUT
  </a>
  <a
    href="#projects"
    (click)="scrollToSection('projects'); $event.preventDefault()"
  >
    PROJECTS
  </a>
  <a
    href="#design"
    (click)="scrollToSection('design'); $event.preventDefault()"
  >
    DESIGN
  </a>
  <a
    href="#contact"
    (click)="scrollToSection('contact'); $event.preventDefault()"
  >
    CONTACT
  </a>

  <div class="drawer-bottom">
    <a
      href="https://www.instagram.com/mejiagemil_/"
      target="_blank"
      rel="noopener noreferrer"
      class="social-icon"
      aria-label="Instagram"
    >
      <i class="fab fa-instagram" aria-hidden="true"></i>
    </a>

    <a
      href="https://www.linkedin.com/in/gemil-m-365346217/"
      target="_blank"
      rel="noopener noreferrer"
      class="social-icon"
      aria-label="LinkedIn"
    >
      <i class="fab fa-linkedin" aria-hidden="true"></i>
    </a>

    <button
      type="button"
      class="dark-mode-toggle"
      (click)="toggleDarkMode()"
      [attr.aria-label]="
        isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'
      "
      [attr.title]="isDarkMode ? 'Light Mode' : 'Dark Mode'"
    >
      <i
        class="fas"
        [class.fa-sun]="isDarkMode"
        [class.fa-moon]="!isDarkMode"
        aria-hidden="true"
      ></i>
    </button>
  </div>
</div>

<!-- PAGE SECTIONS -->

<app-hero (scrollToSection)="scrollToSection($event)"> </app-hero>

<app-about></app-about>

<app-projects></app-projects>

<app-design></app-design>

<app-contact></app-contact>

<!-- BACK TO TOP -->
<button
  class="back-to-top-btn test-btn"
  [class.show]="showBackToTop"
  (click)="scrollToTop()"
>
  <i class="fas fa-arrow-up"></i>
</button>
